name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          ASSET_URL="$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_amd64|linux-amd64")) | .browser_download_url' | head -n 1)"

          if [[ -z "$ASSET_URL" ]]; then
            echo "Could not find the mcp-publisher Linux amd64 asset from the latest release."
            exit 1
          fi

          curl -fsSL "$ASSET_URL" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz
          sudo install -m 0755 ./mcp-publisher /usr/local/bin/mcp-publisher

      - name: Login to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
